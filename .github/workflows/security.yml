# Security gates for the range. The point of running them here is calibration: m13 must FAIL the SCA
# gate and m16 must produce SAST findings. A pipeline that is green against this repository is not
# looking.
name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly rescan: dependencies move even when your code does not.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile everything (also proves the range builds)
        run: ./mvnw -B -DskipTests package
      - name: Run the security test matrix
        run: ./mvnw -B -pl m16-verification test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: secrets live in old commits, not in the working tree.
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tgz && ./gitleaks detect --source . --config tools/gitleaks/.gitleaks.toml --redact --exit-code 1

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Semgrep with the local Spring rules
        run: |
          pip install semgrep
          semgrep scan --config tools/semgrep/spring-security-rules.yml --error --metrics=off .
      - name: SpotBugs + Find Security Bugs (expected to report on m16 fixtures)
        run: ./mvnw -B -Psast -pl m16-verification verify

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: OWASP dependency-check
        run: ./mvnw -B -pl m13-supply-chain org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - name: Image and filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  dast:
    # Baseline active scan against the running range. Keep this job out of the PR path if it is noisy;
    # never let it point at anything but 127.0.0.1.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the range and run a ZAP baseline scan
        run: |
          ./mvnw -q -DskipTests package
          scripts/run-all.sh
          bash scripts/run_dast_zap.sh http://127.0.0.1:8081
        env:
          ZAP_ONLY_LOOPBACK: "true"
