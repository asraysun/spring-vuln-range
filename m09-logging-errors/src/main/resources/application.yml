server:
  port: 8089
  address: 127.0.0.1
  error:
    # VULNERABLE (intentional, and copied from a Stack Overflow answer far too often):
    # stack traces, exception messages and binding errors in every 4xx/5xx response body.
    # /safe9/selftest reports these values so a CI check can fail on them.
    include-stacktrace: always
    include-message: always
    include-binding-errors: always
    include-exception: true
    whitelabel:
      enabled: true

spring:
  application:
    name: m09-logging-errors

logging:
  level:
    root: INFO
  pattern:
    # Correlation id included so one request can be followed across services.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{cid:-none}] %logger{36} - %msg%n"
